[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "puredata-mcp"
version = "0.1.0"
description = "Local MCP server for controlling Pure Data through OSC"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0,<2",
  "python-osc>=1.9.0",
]

[project.scripts]
puredata-mcp = "puredata_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/puredata_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
