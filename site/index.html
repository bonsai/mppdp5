<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101827">
  <title>mppdp5 · UML Viewer</title>
  <style>
    :root { color-scheme: dark; --bg:#101827; --panel:#172235; --line:#34445d; --text:#edf3fb; --muted:#a9b8cc; --accent:#8bd5ca; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif; }
    header, main { width:min(1100px, calc(100% - 32px)); margin-inline:auto; }
    header { padding:32px 0 18px; }
    h1 { margin:0 0 6px; font-size:clamp(1.6rem,4vw,2.4rem); }
    p { color:var(--muted); margin:6px 0 16px; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin:16px 0; }
    button, select { border:1px solid var(--line); border-radius:9px; background:var(--panel); color:var(--text); padding:10px 13px; font:inherit; cursor:pointer; }
    button:hover { border-color:var(--accent); }
    .stage, .editor { border:1px solid var(--line); background:var(--panel); border-radius:14px; overflow:hidden; }
    .stage { min-height:220px; display:grid; place-items:center; padding:18px; }
    .stage img { display:block; max-width:100%; height:auto; }
    .stage .hint { text-align:center; padding:30px; }
    .editor { margin-top:16px; }
    .editor summary { padding:12px 16px; cursor:pointer; color:var(--accent); }
    textarea { display:block; width:100%; min-height:340px; resize:vertical; border:0; border-top:1px solid var(--line); padding:16px; background:#0b1220; color:var(--text); font:13px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace; }
    .status { min-height:1.5em; font-size:.9rem; color:var(--muted); }
    a { color:var(--accent); }
    footer { width:min(1100px, calc(100% - 32px)); margin:24px auto 36px; color:var(--muted); font-size:.9rem; }
    @media (prefers-reduced-motion:no-preference) { button { transition:border-color .15s ease; } }
  </style>
</head>
<body>
  <header>
    <h1>mppdp5 · UML Viewer</h1>
    <p>PlantUML をブラウザで表示。ソースを編集して再描画し、SVGを開いて保存できます。</p>
    <div class="toolbar">
      <label for="diagram">図:</label>
      <select id="diagram">
        <option value="robustness">ロバストネス図</option>
        <option value="ecosystem">エコシステム図</option>
      </select>
      <button id="render" type="button">再描画</button>
      <button id="open-svg" type="button">SVGを開く</button>
      <button id="reset" type="button">元に戻す</button>
    </div>
    <div id="status" class="status" role="status" aria-live="polite">図を読み込んでいます…</div>
  </header>
  <main>
    <section class="stage" aria-label="PlantUML diagram preview">
      <div class="hint" id="hint">PlantUML を描画しています…</div>
      <img id="preview" alt="PlantUML diagram preview" hidden>
    </section>
    <details class="editor" open>
      <summary>PlantUML ソース</summary>
      <textarea id="source" spellcheck="false" aria-label="PlantUML source"></textarea>
    </details>
  </main>
  <footer>
    Rendering uses the public PlantUML server. The source text is sent to that service when you render.
    <br><a href="https://github.com/bonsai/mppdp5">bonsai/mppdp5 on GitHub</a>
  </footer>
  <script src="https://cdn.jsdelivr.net/npm/plantuml-encoder@1.4.0/dist/plantuml-encoder.min.js"></script>
  <script>
    (() => {
      const sources = {
        robustness: "../docs/robustness-diagram.puml",
        ecosystem: "../docs/ontology-ecosystem.puml"
      };
      const selector = document.querySelector("#diagram");
      const source = document.querySelector("#source");
      const preview = document.querySelector("#preview");
      const hint = document.querySelector("#hint");
      const status = document.querySelector("#status");
      let currentSvgUrl = "";
      let requestId = 0;

      function setStatus(message) { status.textContent = message; }
      function draw() {
        if (!window.plantumlEncoder) {
          setStatus("PlantUML encoder を読み込めません。ネットワークを確認してください。");
          return;
        }
        const text = source.value.trim();
        if (!text) { setStatus("PlantUML ソースが空です。"); return; }
        const id = ++requestId;
        const encoded = window.plantumlEncoder.encode(text);
        currentSvgUrl = "https://www.plantuml.com/plantuml/svg/" + encoded;
        hint.hidden = false;
        hint.textContent = "描画中…";
        preview.hidden = true;
        const next = new Image();
        next.onload = () => {
          if (id !== requestId) return;
          preview.src = currentSvgUrl;
          preview.hidden = false;
          hint.hidden = true;
          setStatus("表示できました。");
        };
        next.onerror = () => {
          if (id !== requestId) return;
          hint.hidden = false;
          hint.textContent = "描画できませんでした。PlantUML構文または接続を確認してください。";
          setStatus("描画エラー");
        };
        next.src = currentSvgUrl;
      }
      async function loadSelected() {
        const url = new URL(sources[selector.value], location.href);
        setStatus("ソースを取得中…");
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error("HTTP " + response.status);
          source.value = await response.text();
          draw();
        } catch (error) {
          source.value = "@startuml\ntitle mppdp5\nrectangle \"PlantUML source could not be loaded\"\n@enduml";
          setStatus("ソース取得に失敗しました: " + error.message + "。テキスト欄に直接貼り付けることもできます。");
          draw();
        }
      }
      selector.addEventListener("change", loadSelected);
      document.querySelector("#render").addEventListener("click", draw);
      document.querySelector("#reset").addEventListener("click", loadSelected);
      document.querySelector("#open-svg").addEventListener("click", () => {
        if (currentSvgUrl) window.open(currentSvgUrl, "_blank", "noopener,noreferrer");
        else setStatus("先に図を描画してください。");
      });
      loadSelected();
    })();
  </script>
</body>
</html>
